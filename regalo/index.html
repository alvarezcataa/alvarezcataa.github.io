px solid var(--line); border-radius:4px; padding:1px 6px; color:var(--fg); }\n<\/style>\n\n<main class=\"wrap\">\n  <header>\n    <h1>Nivel 1 · Cervario<\/h1>\n    <p class=\"lead\">Borrador 3. Cata y Juan están en lados distintos del patio y cada uno ve solo lo suyo: lo que hace uno cambia lo que le pasa al otro.<\/p>\n  <\/header>\n\n  <div class=\"stage\">\n    <canvas id=\"game\" tabindex=\"0\" role=\"img\" aria-label=\"Patio de Cervario de noche en pantalla dividida: a la izquierda Cata en las estaciones, a la derecha Juan junto a la mesa y la estufa\"><\/canvas>\n    <button id=\"pausebtn\" hidden aria-label=\"Pausa\">☰ Pausa<\/button>\n    <div class=\"ov\" id=\"pause\" hidden><div class=\"k\">Pausa<\/div><h2>Nivel 1 · Cervario<\/h2><div class=\"btns\"><button id=\"resume\">Continuar<\/button><button id=\"restart\" class=\"alt\">Reiniciar nivel<\/button><\/div><p>Esc / P / Start del mando para pausar<\/p><\/div>\n    <div class=\"ov\" id=\"cover\"><div class=\"cbox\"><div class=\"cbar\" id=\"cbarw\"><i id=\"cbar\"><\/i><\/div><div class=\"cmsg\" id=\"cmsg\">Cargando...<\/div><div class=\"chips\" id=\"cchips\" hidden><button class=\"chip\" id=\"chipc\">CATA · ✕<\/button><button class=\"chip\" id=\"chipj\">JUAN · ✕<\/button><\/div><\/div><\/div>\n    <div class=\"ov\" id=\"intro\" hidden><div class=\"k\">Nivel 01<\/div><h2>Cervario<\/h2><p>Un patio, mucho frío y una estufa apagada.<\/p><button id=\"go\">Empezar<\/button><\/div>\n    <div class=\"ov low\" id=\"dialog\" hidden><div class=\"box-d\"><b id=\"dlgname\">Cata<\/b><p id=\"dlgtext\"><\/p><\/div><button id=\"dlgnext\">Siguiente (Enter)<\/button><\/div>\n    <div class=\"ov\" id=\"card\" hidden><div class=\"k\">NIVEL 01 | CERVARIO<\/div><h2>Confianza vs. Desconfianza<\/h2><p>Enciendan la estufa antes que se congelen.<\/p><p style=\"font-size:12px;opacity:.8\">Juan ve el código de colores. Cata gira las válvulas. Hablen entre ustedes.<\/p><button id=\"playbtn\">Jugar<\/button><\/div>\n    <div class=\"ov\" id=\"frozen\" hidden><div class=\"k\">Se acabó el calor<\/div><h2>Se congelaron<\/h2><p>Probemos de nuevo.<\/p><button id=\"retry\">Reintentar<\/button><\/div>\n    <div class=\"ov\" id=\"endcard\" hidden style=\"background:linear-gradient(transparent 55%,rgba(8,4,12,.9));justify-content:flex-end;padding-bottom:16px\"><div class=\"k\" style=\"font-size:clamp(14px,2.6vw,22px)\">Nivel 01 completado<\/div><button id=\"again\">Jugar de nuevo<\/button><button id=\"next\" hidden style=\"margin-left:10px\">Continuar ▶<\/button><\/div>\n  <\/div>\n\n  <div class=\"row\">\n    <div class=\"box\"><h3>Cata (izquierda)<\/h3><ul><li>Moverse: <kbd>W<\/kbd><kbd>A<\/kbd><kbd>S<\/kbd><kbd>D<\/kbd><\/li><li>Acción: <kbd>E<\/kbd> · Pausa: <kbd>Esc<\/kbd> / <kbd>P<\/kbd><\/li><li>Mando 1: palanca o cruceta, <kbd>X<\/kbd> es la acción, <kbd>Start<\/kbd> pausa<\/li><\/ul><\/div>\n    <div class=\"box\"><h3>Juan (derecha)<\/h3><ul><li>Moverse: flechas<\/li><li>Acción: <kbd>Enter<\/kbd><\/li><li>Mando 2: palanca o cruceta, <kbd>X<\/kbd> es la acción<\/li><\/ul><\/div>\n    <div class=\"box\"><h3>Cómo se juega<\/h3><ul><li>Juan mira las luces de la estufa y le pasa el código de colores a Cata; ella gira las válvulas en ese orden<\/li><li>Con el gas abierto, Cata junta tabaco, filtro y seda y manda la bandeja por el pase<\/li><li>Ella arma el cigarrillo despacio; Juan lo repite rápido para conseguir fuego<\/li><\/ul><\/div>\n  <\/div>\n  <p class=\"lead\">Borrador 3. Los textos son provisorios.<\/p>\n<\/main>\n\n<script>\nconst PC={\"A\": \"#e9b898\", \"B\": \"#010101\", \"C\": \"#cc9474\", \"D\": \"#914444\", \"E\": \"#2e1b14\", \"F\": \"#3b3b3b\", \"G\": \"#be8f50\", \"H\": \"#171719\", \"I\": \"#6b4834\", \"J\": \"#722121\", \"K\": \"#442921\", \"L\": \"#211009\", \"M\": \"#470b0b\", \"N\": \"#bf8366\", \"W\": \"#dcd3cc\", \"X\": \"#2a0f1e\", \"P\": \"#a9a9ad\"};\nconst PJ={K:'#010101',M:'#1b1310',H:'#171719',J:'#3a2a21',D:'#5d4535',A:'#dcaa86',C:'#c68f6b',N:'#a97656',W:'#d9d1c9',X:'#3a20
