<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <link rel="icon" type="image/png" sizes="192x192" href="/favicon_io/favicon-192.png" />

  <style>
    :root {
      --bg: #130c09;
      --w-100: #fff;
      --w-85: rgba(255,255,255,.85);
      --w-70: rgba(255,255,255,.70);
      --w-50: rgba(255,255,255,.50);
      --w-30: rgba(255,255,255,.30);
      --w-15: rgba(255,255,255,.15);
      --w-08: rgba(255,255,255,.08);
      --serif: 'Playfair Display', 'Times New Roman', serif;
      --sans: 'Montserrat', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--w-85); font-family: var(--sans); -webkit-font-smoothing: antialiased; }

    /* Fondo texturado, igual que las pantallas de los servicios */
    .fondo { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .fondo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .fondo::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.3); z-index: 1; }
    .fondo::after { content: ""; position: absolute; inset: 0; z-index: 2;
      background: linear-gradient(to bottom, #130c09 0%, transparent 28%, transparent 70%, #130c09 100%); }

    .pantalla { position: relative; z-index: 3; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 110px 20px 56px; }
    .caja { width: 100%; max-width: 640px; }

    .eyebrow { margin: 0 0 12px; font-size: 10px; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: var(--w-50); }
    .titulo { margin: 0; font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--w-100); line-height: 1.05; font-size: clamp(2.2rem, 6vw, 3.4rem); }
    .intro { margin: 14px 0 0; font-size: 13px; font-weight: 300; line-height: 1.7; color: var(--w-70); }

    .progreso { margin: 32px 0 30px; }
    .progreso-texto { display: block; margin-bottom: 10px; font-size: 10px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--w-50); }
    .progreso-barra { height: 1px; background: var(--w-15); }
    .progreso-fill { height: 100%; width: 0; background: var(--w-85); transition: width .5s cubic-bezier(.2,.7,.2,1); }

    .paso { animation: entra .4s cubic-bezier(.2,.7,.2,1); }
    @keyframes entra { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .pregunta { margin: 0 0 6px; font-size: 13px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--w-85); line-height: 1.5; }
    .ayuda { margin: 0 0 16px; font-size: 12px; font-weight: 300; color: var(--w-50); }
    .pregunta + .bloque { margin-top: 16px; }

    .bloque { background: rgba(255,248,235,.055); border: .5px solid var(--w-15); border-radius: 18px; padding: 20px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

    .pastillas { display: flex; flex-wrap: wrap; gap: 8px; }
    .pastilla { font-family: var(--sans); font-size: 13px; font-weight: 400; letter-spacing: .03em; color: var(--w-70); background: transparent;
      border: .5px solid var(--w-30); border-radius: 100px; padding: 10px 18px; cursor: pointer; transition: all .18s ease; text-align: left; line-height: 1.4; }
    .pastilla:hover { color: var(--w-100); border-color: var(--w-50); background: rgba(255,255,255,.05); }
    .pastilla.sel { color: var(--bg); background: rgba(255,248,235,.92); border-color: rgba(255,248,235,.92); font-weight: 500; }
    .pastilla:focus-visible, .campo input:focus-visible, .campo select:focus-visible, .volver:focus-visible { outline: 2px solid var(--w-85); outline-offset: 2px; }


    /* Elección única: filas completas con círculo (una u otra) */
    .opciones { display: flex; flex-direction: column; gap: 8px; }
    .opcion { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 18px; background: transparent; color: var(--w-70);
      border: .5px solid var(--w-30); border-radius: 14px; cursor: pointer; text-align: left; font-family: var(--sans); font-size: 13.5px; font-weight: 400; letter-spacing: .02em; line-height: 1.4; transition: all .18s ease; }
    .opcion::before { content: ""; flex: 0 0 16px; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--w-50); transition: all .18s ease; }
    .opcion:hover { color: var(--w-100); border-color: var(--w-50); background: rgba(255,255,255,.05); }
    .opcion.sel { color: var(--w-100); border-color: rgba(255,248,235,.9); background: rgba(255,248,235,.08); }
    .opcion.sel::before { border-color: rgba(255,248,235,.95); background: radial-gradient(circle, rgba(255,248,235,.95) 0 38%, transparent 42%); }
    .opcion:focus-visible { outline: 2px solid var(--w-85); outline-offset: 2px; }

    .campos { display: flex; flex-direction: column; gap: 16px; }
    .campo { display: flex; flex-direction: column; gap: 8px; }
    .campo label { font-size: 10px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--w-50); }
    .campo input, .campo select { width: 100%; padding: 12px 18px; background: transparent; border: .5px solid var(--w-30); border-radius: 100px;
      color: var(--w-100); font-family: var(--sans); font-size: 14px; font-weight: 300; letter-spacing: .03em; appearance: none; -webkit-appearance: none; outline: none; transition: border-color .15s; }
    .campo input::placeholder { color: var(--w-30); }
    .campo input:focus, .campo select:focus { border-color: var(--w-70); }
    .campo select { background-image: linear-gradient(45deg, transparent 50%, var(--w-50) 50%), linear-gradient(135deg, var(--w-50) 50%, transparent 50%);
      background-position: calc(100% - 22px) 50%, calc(100% - 16px) 50%; background-size: 6px 6px; background-repeat: no-repeat; }
    .campo select option { background: #1f1511; color: #fff; }
    .campo.error input, .campo.error select { border-color: rgba(214,120,100,.9); }
    .msg-error { display: none; font-size: 11px; color: rgba(230,140,120,.95); padding-left: 6px; }
    .campo.error .msg-error { display: block; }
    .check { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--w-70); cursor: pointer; }
    .check input { width: 16px; height: 16px; accent-color: #fff8eb; }
    .trampa { position: absolute; left: -9999px; height: 0; overflow: hidden; opacity: 0; }

    .acciones { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 26px; flex-wrap: wrap; }
    .acciones .btn-cta-servicio { margin: 0; cursor: pointer; background: transparent; font-family: var(--sans); }
    .acciones .btn-cta-servicio[disabled] { opacity: .3; cursor: not-allowed; pointer-events: none; }
    .volver { background: none; border: 0; padding: 6px 2px; cursor: pointer; font-family: var(--sans); font-size: 10px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--w-50); transition: color .2s; }
    .volver:hover { color: var(--w-100); }
    .nota { margin: 18px 0 0; font-size: 11px; font-weight: 300; line-height: 1.6; color: var(--w-50); }

    @media (max-width: 810px) {
      .pantalla { padding: 96px 16px 40px; align-items: flex-start; }
      .bloque { padding: 16px; }
      .pastilla { font-size: 12.5px; padding: 10px 16px; }
      .acciones { flex-direction: column-reverse; align-items: stretch; text-align: center; }
      .acciones .btn-cta-servicio { text-align: center; }
    }
      select[hidden], input[hidden], .campo[hidden] { display: none; }
    .campo-otro { margin-top: 18px; }
    .campo-otro[hidden] { display: none; }
  </style>
</head>

      <header>

  <script>
    var sideMenu = document.getElementById('sideMenu');
    window.toggleMenu = function () { if (sideMenu) sideMenu.classList.toggle('open'); };
    document.addEventListener('click', function (e) {
      if (!sideMenu || !sideMenu.classList.contains('open')) return;
      var t = document.querySelector('.menu-toggle');
      if (sideMenu.contains(e.target) || (t && t.contains(e.target))) return;
      sideMenu.classList.remove('open');
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sideMenu) sideMenu.classList.remove('open'); });
  </script>

  <script src="/js/config.js"></script>
  <script>
  (function () {
    var CFG = window.CAVLA_CONFIG || {};
    var dudas = document.getElementById('nav-dudas');
    if (dudas && CFG.whatsapp) {
      dudas.href = 'https://wa.me/' + CFG.whatsapp + '?text=' + encodeURIComponent('Hola Cata, tengo una duda antes de empezar mi proyecto.');
      dudas.target = '_blank'; dudas.rel = 'noopener';
    }
    var PROVINCIAS = ['Buenos Aires','Ciudad Autónoma de Buenos Aires','Catamarca','Chaco','Chubut','Córdoba','Corrientes','Entre Ríos','Formosa','Jujuy','La Pampa','La Rioja','Mendoza','Misiones','Neuquén','Río Negro','Salta','San Juan','San Luis','Santa Cruz','Santa Fe','Santiago del Estero','Tierra del Fuego','Tucumán','Otro país'];

    // ── Recorrido del formulario ──────────────────────────────
    var LOCALIDADES = ['Córdoba Capital', 'Villa Allende', 'Mendiolaza', 'Unquillo', 'Río Ceballos', 'Salsipuedes', 'La Calera', 'Saldán', 'Malagueño', 'Villa Carlos Paz']
      .sort(function (a, b) { return a.localeCompare(b, 'es'); }).concat(['Otra']);   // ciudades donde se trabaja de forma presencial (alfabético) + Otra
    var PROFUNDIDAD = ['Quiero reorganizar lo que ya tengo', 'Quiero un rediseño completo del espacio'];
    var BORRAR = ['virtual', 'tipo', 'mueble', 'otro_mueble', 'condicion', 'ejecucion', 'espacio', 'rubro', 'alcance', 'ambientes', 'otro_ambientes', 'superficie', 'superficieCasa',
                  'estado', 'marca', 'estadoEsp', 'problemas', 'otro_problemas', 'profundidad', 'profundidadC', 'etapa', 'uso', 'ejecucionObra'];
    var DEPENDE = {
      lugar: ['virtual', 'ejecucion', 'ejecucionObra'],
      tipo: BORRAR.slice(2),
      espacio: ['rubro', 'alcance', 'ambientes', 'otro_ambientes', 'superficie', 'superficieCasa', 'estado', 'marca', 'estadoEsp', 'problemas', 'otro_problemas', 'profundidad', 'profundidadC', 'etapa', 'uso', 'ejecucionObra'],
      estadoEsp: ['problemas', 'otro_problemas', 'profundidad', 'profundidadC', 'etapa', 'uso']
    };

    // ── Recorrido del formulario ──────────────────────────────
    var PASOS = {
      lugar:  { tipo: 'lugar', q: '¿Dónde es el proyecto?',
                ayuda: 'Trabajamos de forma presencial en Córdoba y alrededores. En el resto del país el trabajo es 100% virtual.',
                next: function () { return esPresencial() ? 'tipo' : 'virtual'; } },
      virtual:{ tipo: 'single', q: '¿Estás de acuerdo con que trabajemos 100% virtual?',
                ayuda: 'Fuera de Córdoba Capital y sus alrededores trabajamos de forma virtual. No hacemos visitas ni ejecutamos obras en persona, pero desarrollamos tu proyecto con la misma calidad.',
                opts: ['Sí, estoy de acuerdo', 'Prefiero algo presencial'],
                next: function (a) { return a === 0 ? 'tipo' : 'virtualaviso'; } },
      virtualaviso:{ tipo: 'info', q: 'Por ahora solo trabajamos de forma virtual en tu zona',
                ayuda: 'Igualmente podés continuar con el formulario y buscamos una solución por WhatsApp.',
                next: function () { return 'tipo'; } },
      tipo:   { tipo: 'single', q: '¿Qué tipo de diseño necesitás?',
                opts: ['Solo necesito diseñar muebles', 'Quiero diseñar un espacio'],
                next: function (a) { return a === 0 ? 'mueble' : 'espacio'; } },
      mueble: { tipo: 'multi', q: '¿Qué muebles querés diseñar?', ayuda: 'Podés elegir más de uno.',
                opts: ['Cocina', 'Placard / vestidor', 'Baño', 'Living / TV', 'Escritorio / oficina', 'Otro'], otro: 5, otroPh: 'Contanos qué mueble es',
                next: function () { return 'condicion'; } },
      condicion:{ tipo: 'single', q: '¿En qué condiciones está el espacio?',
                opts: ['Espacio existente', 'Obra en construcción'],
                next: function () { return esPresencial() ? 'ejecucion' : 'presupuesto'; } },
      ejecucion:{ tipo: 'single', q: '¿Cómo querés ejecutarlo?',
                opts: ['Tengo carpintero', 'Quiero que el estudio se encargue'],
                next: function () { return 'presupuesto'; } },
      espacio:{ tipo: 'single', q: '¿Qué tipo de espacio es?',
                opts: ['Casa', 'Departamento', 'Local comercial', 'Local gastronómico'],
                next: function (a) { return a >= 2 ? 'rubro' : 'estadoEsp'; } },
      estadoEsp:{ tipo: 'single', q: '¿En qué condiciones está el espacio?',
                opts: ['Espacio existente en buen estado', 'Espacio existente en mal estado', 'Espacio a estrenar', 'Obra en construcción'],
                next: function (a) { return ['profundidad', 'problemas', 'profundidadC', 'etapa'][a]; } },
      profundidad:{ tipo: 'single', q: '¿Qué nivel de profundidad buscás?', opts: PROFUNDIDAD,
                next: function () { return 'ambientes'; } },
      problemas:{ tipo: 'multi', q: '¿Qué tipo de problemas tiene el espacio?', ayuda: 'Podés elegir más de uno.',
                opts: ['Problemas de instalaciones', 'Humedades', 'Problemas estructurales', 'Paredes deterioradas', 'Otro'], otro: 4, otroPh: 'Contanos qué problema es',
                next: function () { return 'profundidad'; } },
      profundidadC:{ tipo: 'single', q: '¿Qué nivel de profundidad buscás?',
                opts: ['Quiero adaptar mis pertenencias a este nuevo espacio', 'Quiero un diseño completo desde cero'],
                next: function () { return 'ambientes'; } },
      etapa:  { tipo: 'single', q: '¿En qué etapa está la obra?',
                opts: ['Recién empieza (estructura)', 'En terminaciones', 'Casi terminada'],
                next: function () { return 'uso'; } },
      uso:    { tipo: 'single', q: '¿Para qué es el inmueble?',
                opts: ['Para vivirlo yo o mi familia', 'Para venderlo amoblado'],
                next: function () { return 'ambientes'; } },
      ambientes:{ tipo: 'multi', q: '¿Qué ambientes querés trabajar?', ayuda: 'Podés elegir más de uno.',
                opts: ['Living / comedor', 'Cocina', 'Dormitorios', 'Baños', 'Otro'], otro: 4, otroPh: 'Contanos qué ambiente es',
                next: function () { return 'superficieCasa'; } },
      superficieCasa:{ tipo: 'single', q: '¿Cuántos m² tiene, aproximadamente?',
                opts: ['Hasta 50 m²', 'Entre 50 y 100 m²', 'Entre 100 y 200 m²', 'Más de 200 m²'],
                next: function () { return esPresencial() ? 'ejecucionObra' : 'presupuesto'; } },
      ejecucionObra:{ tipo: 'single', q: '¿Cómo querés ejecutarlo?',
                opts: ['Tengo quien ejecute la obra', 'Quiero que el estudio se encargue'],
                next: function () { return 'presupuesto'; } },
      rubro:  { tipo: 'single', q: '¿De qué rubro es?',
                opts: function () { return esLocal() && indices.espacio === 3 ? ['Café', 'Restaurante', 'Bar', 'Otro'] : ['Indumentaria / accesorios', 'Estética y bienestar', 'Salud', 'Servicios / oficina', 'Otro']; },
                next: function () { return 'alcance'; } },
      alcance:{ tipo: 'single', q: '¿Qué nivel de profundidad buscás?',
                opts: ['Quiero reorganizar lo que ya tengo', 'Quiero un rediseño completo del espacio', 'Tengo problemas de instalaciones, humedades o estructura'],
                next: function () { return 'superficie'; } },
      superficie:{ tipo: 'single', q: '¿Qué superficie tiene, aproximadamente?',
                opts: ['Hasta 30 m²', 'Entre 30 y 60 m²', 'Entre 60 y 100 m²', 'Más de 100 m²'],
                next: function () { return 'estado'; } },
      estado: { tipo: 'single', q: '¿En qué estado está el local?',
                opts: ['Local nuevo, a estrenar', 'Ya está funcionando y lo quiero renovar'],
                next: function () { return 'marca'; } },
      marca:  { tipo: 'single', q: '¿Ya tienen marca?',
                opts: ['Sí, con identidad definida', 'Está en proceso', 'Todavía no'],
                next: function () { return 'presupuesto'; } },
      presupuesto:{ tipo: 'campos', q: '¿Con qué presupuesto contás?',
                ayuda: 'Para el proyecto completo (obra, muebles o ambos). Una cifra aproximada alcanza.',
                campos: [ { id: 'presupuesto', label: 'Presupuesto aproximado', tipo: 'text', ph: 'Ej: 5.000.000 pesos o 4.000 USD' },
                          { id: 'presupuesto_nd', label: 'Todavía no lo definí', tipo: 'check' } ],
                validar: function (v) { return (v.presupuesto || v.presupuesto_nd) ? null : { presupuesto: 'Escribí una cifra o marcá que todavía no lo definiste.' }; },
                next: function () { return 'datos'; } },
      datos:  { tipo: 'campos', q: 'Por último, ¿cómo te contacto?', final: true,
                campos: [ { id: 'nombre', label: 'Nombre y apellido', tipo: 'text', req: true, auto: 'name' },
                          { id: 'telefono', label: 'WhatsApp', tipo: 'tel', ph: 'Ej: 351 555 1234', req: true, auto: 'tel' },
                          { id: 'email', label: 'Email', tipo: 'email', req: true, auto: 'email' } ],
                next: function () { return null; } }
    };

    var respuestas = {}, indices = {}, historial = ['lugar'];
    var cont = document.getElementById('paso');

    function getOpts(p) { return typeof p.opts === 'function' ? p.opts() : p.opts; }
    function esLocal() { return indices.espacio >= 2; }
    function esPresencial() { var l = respuestas.lugar; return !(l && !l.presencial); }
    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function totalPasos() {
      var pres = esPresencial(), ej = pres ? 1 : 0;
      var n = 2 + (pres ? 0 : 1) + (respuestas.virtual === 'Prefiero algo presencial' ? 1 : 0);   // lugar, [virtual], [aviso], tipo
      if (indices.tipo === 0) return n + 4 + ej;                                                    // muebles: mueble, condición, [ejecución], presupuesto, datos → +4 con ejecución
      if (esLocal()) return n + 8;                                                                  // espacio, rubro, alcance, superficie, estado, marca, presupuesto, datos
      var rama = (indices.estadoEsp === 1 || indices.estadoEsp === 3) ? 1 : 0;                      // B: +problemas · D: +uso
      return n + 7 + rama + ej;                                                                     // espacio, estado, profundidad, ambientes, m², [ejecución], presupuesto, datos
    }

    function progreso() {
      var n = historial.length, t = totalPasos();
      document.getElementById('texto-progreso').textContent = 'Paso ' + n + ' de ' + t;
      document.getElementById('barra-fill').style.width = ((n - 0.5) / t * 100) + '%';
    }

    function render() {
      var id = historial[historial.length - 1], p = PASOS[id];
      progreso();
      var h = '<h2 class="pregunta">' + esc(p.q) + '</h2>' + (p.ayuda ? '<p class="ayuda">' + esc(p.ayuda) + '</p>' : '');
      if (p.tipo === 'single' || p.tipo === 'multi') {
        var unica = p.tipo === 'single', cl = unica ? 'opcion' : 'pastilla';
        h += '<div class="bloque"><div class="' + (unica ? 'opciones' : 'pastillas') + '" role="' + (unica ? 'radiogroup' : 'group') + '">';
        getOpts(p).forEach(function (o, i) { h += '<button type="button" class="' + cl + '" data-i="' + i + '"' + (unica ? ' role="radio"' : '') + '>' + esc(o) + '</button>'; });
        h += '</div>';
        if (p.otro !== undefined) h += '<div class="campo campo-otro" id="caja-otro" hidden><label for="f-otro">¿Cuál?</label><input id="f-otro" type="text" maxlength="80" placeholder="' + esc(p.otroPh || 'Contanos cuál es') + '"></div>';
        h += '</div><div class="acciones">' +
             (historial.length > 1 ? '<button type="button" class="volver" id="volver">← Volver</button>' : '<span></span>') +
             (p.tipo === 'multi' ? '<button type="button" class="btn-cta-servicio" id="continuar" disabled>Continuar</button>' : '') + '</div>';
      } else if (p.tipo === 'lugar') {
        h += '<form id="form-paso" novalidate><div class="bloque"><div class="campos">' +
             '<div class="campo"><label for="f-provincia">Provincia</label><select id="f-provincia"><option value="">Elegí una opción</option>' +
             PROVINCIAS.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select><span class="msg-error">Elegí la provincia.</span></div>' +
             '<div class="campo" id="w-ciudad"><label for="f-ciudad">Ciudad</label><select id="f-ciudad" disabled><option value="">Primero elegí la provincia</option></select>' +
             '<input id="f-ciudad-txt" type="text" placeholder="Escribí la ciudad" hidden><span class="msg-error">Elegí o escribí la ciudad.</span></div>' +
             '<div class="campo" id="w-cual" hidden><label for="f-cual" id="l-cual">¿Cuál?</label><input id="f-cual" type="text" placeholder="Ej: Villa María"><span class="msg-error">Escribí la ciudad.</span></div>' +
             '</div></div><div class="acciones"><span></span><button type="submit" class="btn-cta-servicio">Continuar</button></div></form>';
      } else if (p.tipo === 'info') {
        h += '<div class="acciones">' + (historial.length > 1 ? '<button type="button" class="volver" id="volver">← Volver</button>' : '<span></span>') +
             '<button type="button" class="btn-cta-servicio" id="continuar-info">Continuar</button></div>';
      } else {
        h += '<form id="form-paso" novalidate><div class="bloque"><div class="campos">';
        p.campos.forEach(function (c) {
          if (c.tipo === 'check') {
            h += '<label class="check"><input type="checkbox" id="f-' + c.id + '"> ' + esc(c.label) + '</label>';
          } else if (c.tipo === 'select') {
            h += '<div class="campo"><label for="f-' + c.id + '">' + esc(c.label) + '</label><select id="f-' + c.id + '"><option value="">Elegí una opción</option>' +
                 (c.opciones || PROVINCIAS).map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select><span class="msg-error">Completá este campo.</span></div>';
          } else {
            h += '<div class="campo"' + (c.si ? ' id="w-' + c.id + '" hidden' : '') + '><label for="f-' + c.id + '">' + esc(c.label) + '</label><input id="f-' + c.id + '" type="' + c.tipo + '"' +
                 (c.ph ? ' placeholder="' + esc(c.ph) + '"' : '') + (c.auto ? ' autocomplete="' + c.auto + '"' : '') + (c.tipo === 'tel' ? ' inputmode="tel"' : '') + '><span class="msg-error">Completá este campo.</span></div>';
          }
        });
        h += '</div></div>';
        if (p.final) h += '<div class="trampa" aria-hidden="true"><label>No completar<input type="text" id="f-web" tabindex="-1" autocomplete="off"></label></div>';
        h += '<div class="acciones">' + (historial.length > 1 ? '<button type="button" class="volver" id="volver">← Volver</button>' : '<span></span>') +
             '<button type="submit" class="btn-cta-servicio">' + (p.final ? 'Enviar por WhatsApp' : 'Continuar') + '</button></div>';
        if (p.final) h += '<p class="nota">Se abre WhatsApp con tus respuestas ya escritas. Solo usamos tus datos para responderte.</p>';
        h += '</form>';
      }
      cont.innerHTML = h;
      cont.classList.remove('paso'); void cont.offsetWidth; cont.classList.add('paso');
      enlazar(id, p);
    }

    function enlazar(id, p) {
      var v = document.getElementById('volver');
      if (v) v.addEventListener('click', function () { historial.pop(); render(); });

      if (p.tipo === 'lugar') {
        enlazarLugar(id, p);
      } else if (p.tipo === 'info') {
        document.getElementById('continuar-info').addEventListener('click', function () { avanzar(p, null); });
      } else if (p.tipo === 'single') {
        cont.querySelectorAll('.opcion').forEach(function (b) {
          var i = +b.getAttribute('data-i');
          if (indices[id] === i) b.classList.add('sel');
          b.addEventListener('click', function () {
            cont.querySelectorAll('.opcion').forEach(function (x) { x.classList.remove('sel'); });
            b.classList.add('sel');
            setTimeout(function () { guardarUnica(id, p, i); }, 180);
          });
        });
      } else if (p.tipo === 'multi') {
        var sel = (indices[id] || []).slice(), btnC = document.getElementById('continuar');
        function pinta() {
          cont.querySelectorAll('.pastilla').forEach(function (b) { b.classList.toggle('sel', sel.indexOf(+b.getAttribute('data-i')) > -1); });
          var otroSel = p.otro !== undefined && sel.indexOf(p.otro) > -1, cajaO = document.getElementById('caja-otro');
          if (cajaO) cajaO.hidden = !otroSel;
          btnC.disabled = sel.length === 0 || (otroSel && !document.getElementById('f-otro').value.trim());
        }
        var inpO = document.getElementById('f-otro');
        if (inpO) { inpO.value = respuestas['otro_' + id] || ''; inpO.addEventListener('input', pinta); }
        cont.querySelectorAll('.pastilla').forEach(function (b) {
          b.addEventListener('click', function () {
            var i = +b.getAttribute('data-i'), k = sel.indexOf(i);
            if (k > -1) sel.splice(k, 1); else sel.push(i);
            pinta();
          });
        });
        btnC.addEventListener('click', function () {
          sel.sort(function (a, b) { return a - b; });
          indices[id] = sel; respuestas[id] = sel.map(function (i) { return getOpts(p)[i]; });
          if (p.otro !== undefined) {
            var tO = inpO.value.trim(), k = sel.indexOf(p.otro);
            respuestas['otro_' + id] = tO;
            if (k > -1) respuestas[id][k] = 'Otro: ' + tO;
          }
          avanzar(p, sel);
        });
        pinta();
      } else {
        var form = document.getElementById('form-paso');
        p.campos.forEach(function (c) {
          var el = document.getElementById('f-' + c.id), prev = respuestas[id] && respuestas[id][c.id];
          if (prev !== undefined && el) { if (c.tipo === 'check') el.checked = !!prev; else el.value = prev; }
        });
        p.campos.forEach(function (c) {
          if (!c.si) return;
          var origen = document.getElementById('f-' + c.si), wrap = document.getElementById('w-' + c.id);
          function muestra() { wrap.hidden = origen.value !== c.siVal; }
          origen.addEventListener('change', muestra); muestra();
        });
        form.addEventListener('submit', function (e) { e.preventDefault(); enviarPaso(id, p, form); });
      }
    }

    function limpiar(id) { (DEPENDE[id] || []).forEach(function (k) { delete respuestas[k]; delete indices[k]; }); }
    function enlazarLugar(id, p) {
      var prov = document.getElementById('f-provincia'), sel = document.getElementById('f-ciudad'), txt = document.getElementById('f-ciudad-txt'),
          wc = document.getElementById('w-cual'), wCiudad = document.getElementById('w-ciudad'), lCual = document.getElementById('l-cual'), cual = document.getElementById('f-cual'), prev = respuestas.lugar || {};
      function actualiza() {
        var pv = prov.value, esCba = pv === 'Córdoba', pais = pv === 'Otro país';
        wCiudad.hidden = pais;
        lCual.textContent = pais ? 'País' : '¿Cuál?'; cual.placeholder = pais ? 'Ej: España' : 'Ej: Villa María';
        if (pais) { wc.hidden = false; return; }
        if (!pv) { sel.hidden = false; sel.disabled = true; sel.innerHTML = '<option value="">Primero elegí la provincia</option>'; txt.hidden = true; wc.hidden = true; return; }
        if (esCba) {
          if (!sel.getAttribute('data-cba')) {
            sel.innerHTML = '<option value="">Elegí una opción</option>' + LOCALIDADES.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('');
            sel.setAttribute('data-cba', '1');
          }
          sel.hidden = false; sel.disabled = false; txt.hidden = true; wc.hidden = sel.value !== 'Otra';
        } else {
          sel.hidden = true; sel.removeAttribute('data-cba'); txt.hidden = false; wc.hidden = true;
        }
      }
      if (prev.provincia) {
        prov.value = prev.provincia; actualiza();
        if (prev.provincia === 'Otro país') { cual.value = prev.ciudad || ''; }
        else if (prev.provincia === 'Córdoba') { sel.value = prev.enLista ? prev.ciudad : 'Otra'; if (!prev.enLista) { cual.value = prev.ciudad; } actualiza(); }
        else txt.value = prev.ciudad || '';
      }
      prov.addEventListener('change', function () { sel.removeAttribute('data-cba'); sel.value = ''; txt.value = ''; cual.value = ''; actualiza(); });
      sel.addEventListener('change', actualiza);
      document.getElementById('form-paso').addEventListener('submit', function (e) {
        e.preventDefault();
        var pv = prov.value, esCba = pv === 'Córdoba', ciudad = '', enLista = false, ok = true;
        [prov, sel, txt, cual].forEach(function (el) { var w = el.closest('.campo'); if (w) w.classList.remove('error'); });
        function error(el) { var w = el.closest('.campo'); if (w) w.classList.add('error'); if (ok) el.focus(); ok = false; }
        if (!pv) error(prov);
        else if (pv === 'Otro país') { ciudad = cual.value.trim(); if (!ciudad) { cual.closest('.campo').querySelector('.msg-error').textContent = 'Escribí el país.'; error(cual); } }
        else if (esCba) {
          if (!sel.value) error(sel);
          else if (sel.value === 'Otra') { ciudad = cual.value.trim(); if (!ciudad) error(cual); }
          else { ciudad = sel.value; enLista = true; }
        } else { ciudad = txt.value.trim(); if (!ciudad) error(txt); }
        if (!ok) return;
        var antes = respuestas.lugar;
        respuestas.lugar = { provincia: pv, ciudad: ciudad, enLista: enLista, presencial: esCba && enLista };
        if (antes && antes.presencial !== respuestas.lugar.presencial) limpiar('lugar');
        avanzar(p, null);
      });
    }
    function guardarUnica(id, p, i) {
      var cambio = indices[id] !== undefined && indices[id] !== i;
      indices[id] = i; respuestas[id] = getOpts(p)[i];
      if (cambio) limpiar(id);
      avanzar(p, i);
    }
    function avanzar(p, a) { var sig = p.next(a); if (sig) { historial.push(sig); render(); } }

    function enviarPaso(id, p, form) {
      var vals = {}, ok = true;
      p.campos.forEach(function (c) {
        var el = document.getElementById('f-' + c.id);
        vals[c.id] = c.tipo === 'check' ? el.checked : el.value.trim();
        var w = el.closest('.campo'); if (w) w.classList.remove('error');
      });
      function marcar(idc, msg) {
        var el = document.getElementById('f-' + idc), w = el && el.closest('.campo');
        if (w) { w.classList.add('error'); if (msg) w.querySelector('.msg-error').textContent = msg; }
        ok = false;
      }
      p.campos.forEach(function (c) { if (c.req && !vals[c.id]) marcar(c.id, 'Completá este campo.'); });
      if (vals.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(vals.email)) marcar('email', 'Revisá el email, parece incompleto.');
      if (vals.telefono && vals.telefono.replace(/\D/g, '').length < 8) marcar('telefono', 'Escribí tu número con característica.');
      if (p.validar) { var er = p.validar(vals); if (er) Object.keys(er).forEach(function (k) { marcar(k, er[k]); }); }
      if (!ok) { var primero = form.querySelector('.campo.error input, .campo.error select'); if (primero) primero.focus(); return; }
      respuestas[id] = vals;
      if (p.final) { var tr = document.getElementById('f-web'); finalizar(tr && tr.value); return; }
      avanzar(p, null);
    }

    // ── Mensaje de WhatsApp y guardado ────────────────────────
    function lista(v) { return Array.isArray(v) ? v.join(', ') : v; }
    function resumen() {
      var r = respuestas, d = r.datos || {}, l = r.lugar || {}, pr = r.presupuesto || {}, pres = esPresencial();
      var ub = l.ciudad ? (l.provincia === 'Otro país' ? l.ciudad : l.ciudad + ', ' + l.provincia) : '';
      var modalidad = pres ? 'Presencial' : (r.virtual === 'Prefiero algo presencial' ? 'Virtual (prefiere algo presencial)' : 'Virtual (aceptó)');
      return {
        ubicacion: ub, modalidad: modalidad,
        tipo_diseno: r.tipo || '', muebles: r.mueble ? lista(r.mueble) : '', tipo_espacio: r.espacio || '',
        rubro: r.rubro || '', superficie: r.superficie || r.superficieCasa || '', estado_local: r.estado || '', marca: r.marca || '',
        condicion: r.estadoEsp || r.condicion || '', problemas: r.problemas ? lista(r.problemas) : '', etapa: r.etapa || '', uso: r.uso || '',
        ejecucion: pres ? (r.ejecucion || r.ejecucionObra || '') : 'A cargo del cliente (proyecto virtual)',
        alcance: r.profundidad || r.profundidadC || r.alcance || '', ambientes: r.ambientes ? lista(r.ambientes) : '',
        presupuesto: pr.presupuesto_nd ? 'Todavía no lo definió' : (pr.presupuesto || ''),
        provincia: l.provincia || '', ciudad: l.ciudad || '', nombre: d.nombre || '', telefono: d.telefono || '', email: d.email || ''
      };
    }
    function mensaje(c) {
      var l = ['Hola Cata, soy ' + c.nombre + '. Completé el formulario en la web:', ''];
      l.push('• Ubicación: ' + c.ubicacion);
      l.push('• Modalidad: ' + c.modalidad);
      l.push('• Diseño: ' + c.tipo_diseno);
      if (c.muebles) l.push('• Muebles: ' + c.muebles);
      if (c.tipo_espacio) l.push('• Espacio: ' + c.tipo_espacio);
      if (c.rubro) l.push('• Rubro: ' + c.rubro);
      if (c.condicion) l.push('• Condición del espacio: ' + c.condicion);
      if (c.problemas) l.push('• Problemas: ' + c.problemas);
      if (c.etapa) l.push('• Etapa de la obra: ' + c.etapa);
      if (c.uso) l.push('• Uso del inmueble: ' + c.uso);
      if (c.alcance) l.push('• Alcance: ' + c.alcance);
      if (c.superficie) l.push('• Superficie: ' + c.superficie);
      if (c.estado_local) l.push('• Estado del local: ' + c.estado_local);
      if (c.marca) l.push('• Marca: ' + c.marca);
      if (c.ambientes) l.push('• Ambientes: ' + c.ambientes);
      if (c.ejecucion) l.push('• Ejecución: ' + c.ejecucion);
      l.push('• Presupuesto: ' + c.presupuesto);
      l.push('• Email: ' + c.email);
      l.push('• WhatsApp: ' + c.telefono);
      return l.join('\n');
    }

    function finalizar(esBot) {
      var c = resumen(), url = 'https://wa.me/' + CFG.whatsapp + '?text=' + encodeURIComponent(mensaje(c));
      if (!esBot && CFG.appsScriptUrl) {
        try {
          fetch(CFG.appsScriptUrl, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(Object.assign({ origen: location.href }, c)) });
        } catch (e) { /* si falla el guardado igual seguimos por WhatsApp */ }
      }
      document.getElementById('texto-progreso').textContent = 'Listo';
      document.getElementById('barra-fill').style.width = '100%';
      cont.innerHTML = '<h2 class="pregunta">Gracias, ' + esc(c.nombre.split(' ')[0]) + '.</h2>' +
        '<p class="ayuda">Te llevo a WhatsApp con tus respuestas ya escritas. Solo tenés que apretar enviar.</p>' +
        '<div class="acciones"><span></span><a class="btn-cta-servicio" href="' + url + '" target="_blank" rel="noopener">Abrir WhatsApp</a></div>';
      setTimeout(function () { window.location.href = url; }, 900);
    }

    render();
  })();
  </script>
