  <style>
    :root {
      --bg: #130c09;
      --w-100: #fff;
      --w-85: rgba(255,255,255,.85);
      --w-70: rgba(255,255,255,.70);
      --w-50: rgba(255,255,255,.50);
      --w-30: rgba(255,255,255,.30);
      --w-15: rgba(255,255,255,.15);
      --w-08: rgba(255,255,255,.08);
      --serif: 'Playfair Display', 'Times New Roman', serif;
      --sans: 'Montserrat', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--w-85); font-family: var(--sans); -webkit-font-smoothing: antialiased; }

    /* Fondo texturado, igual que las pantallas de los servicios */
    .fondo { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .fondo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .fondo::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.3); z-index: 1; }
    .fondo::after { content: ""; position: absolute; inset: 0; z-index: 2;
      background: linear-gradient(to bottom, #130c09 0%, transparent 28%, transparent 70%, #130c09 100%); }

    .pantalla { position: relative; z-index: 3; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 110px 20px 56px; }
    .caja { width: 100%; max-width: 640px; }

    .eyebrow { margin: 0 0 12px; font-size: 10px; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: var(--w-50); }
    .titulo { margin: 0; font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--w-100); line-height: 1.05; font-size: clamp(2.2rem, 6vw, 3.4rem); }
    .intro { margin: 14px 0 0; font-size: 13px; font-weight: 300; line-height: 1.7; color: var(--w-70); }

    .progreso { margin: 32px 0 30px; }
    .progreso-texto { display: block; margin-bottom: 10px; font-size: 10px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--w-50); }
    .progreso-barra { height: 1px; background: var(--w-15); }
    .progreso-fill { height: 100%; width: 0; background: var(--w-85); transition: width .5s cubic-bezier(.2,.7,.2,1); }

    .paso { animation: entra .4s cubic-bezier(.2,.7,.2,1); }
    @keyframes entra { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .pregunta { margin: 0 0 6px; font-size: 13px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--w-85); line-height: 1.5; }
    .ayuda { margin: 0 0 16px; font-size: 12px; font-weight: 300; color: var(--w-50); }
    .pregunta + .bloque { margin-top: 16px; }

    .bloque { background: rgba(255,248,235,.055); border: .5px solid var(--w-15); border-radius: 18px; padding: 20px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

    .pastillas { display: flex; flex-wrap: wrap; gap: 8px; }
    .pastilla { font-family: var(--sans); font-size: 13px; font-weight: 400; letter-spacing: .03em; color: var(--w-70); background: transparent;
      border: .5px solid var(--w-30); border-radius: 100px; padding: 10px 18px; cursor: pointer; transition: all .18s ease; text-align: left; line-height: 1.4; }
    .pastilla:hover { color: var(--w-100); border-color: var(--w-50); background: rgba(255,255,255,.05); }
    .pastilla.sel { color: var(--bg); background: rgba(255,248,235,.92); border-color: rgba(255,248,235,.92); font-weight: 500; }
    .pastilla:focus-visible, .campo input:focus-visible, .campo select:focus-visible, .volver:focus-visible { outline: 2px solid var(--w-85); outline-offset: 2px; }


    /* Elección única: filas completas con círculo (una u otra) */
    .opciones { display: flex; flex-direction: column; gap: 8px; }
    .opcion { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 18px; background: transparent; color: var(--w-70);
      border: .5px solid var(--w-30); border-radius: 14px; cursor: pointer; text-align: left; font-family: var(--sans); font-size: 13.5px; font-weight: 400; letter-spacing: .02em; line-height: 1.4; transition: all .18s ease; }
    .opcion::before { content: ""; flex: 0 0 16px; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--w-50); transition: all .18s ease; }
    .opcion:hover { color: var(--w-100); border-color: var(--w-50); background: rgba(255,255,255,.05); }
    .opcion.sel { color: var(--w-100); border-color: rgba(255,248,235,.9); background: rgba(255,248,235,.08); }
    .opcion.sel::before { border-color: rgba(255,248,235,.95); background: radial-gradient(circle, rgba(255,248,235,.95) 0 38%, transparent 42%); }
    .opcion:focus-visible { outline: 2px solid var(--w-85); outline-offset: 2px; }

    .campos { display: flex; flex-direction: column; gap: 16px; }
    .campo { display: flex; flex-direction: column; gap: 8px; }
    .campo label { font-size: 10px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--w-50); }
    .campo input, .campo select { width: 100%; padding: 12px 18px; background: transparent; border: .5px solid var(--w-30); border-radius: 100px;
      color: var(--w-100); font-family: var(--sans); font-size: 14px; font-weight: 300; letter-spacing: .03em; appearance: none; -webkit-appearance: none; outline: none; transition: border-color .15s; }
    .campo input::placeholder { color: var(--w-30); }
    .campo input:focus, .campo select:focus { border-color: var(--w-70); }
    .campo select { background-image: linear-gradient(45deg, transparent 50%, var(--w-50) 50%), linear-gradient(135deg, var(--w-50) 50%, transparent 50%);
      background-position: calc(100% - 22px) 50%, calc(100% - 16px) 50%; background-size: 6px 6px; background-repeat: no-repeat; }
    .campo select option { background: #1f1511; color: #fff; }
    .campo.error input, .campo.error select { border-color: rgba(214,120,100,.9); }
    .msg-error { display: none; font-size: 11px; color: rgba(230,140,120,.95); padding-left: 6px; }
    .campo.error .msg-error { display: block; }
    .check { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--w-70); cursor: pointer; }
    .check input { width: 16px; height: 16px; accent-color: #fff8eb; }
    .trampa { position: absolute; left: -9999px; height: 0; overflow: hidden; opacity: 0; }

    .acciones { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 26px; flex-wrap: wrap; }
    .acciones .btn-cta-servicio { margin: 0; cursor: pointer; background: transparent; font-family: var(--sans); }
    .acciones .btn-cta-servicio:hover { background: rgba(255,255,255,.16); color: #fff; }
    .acciones .btn-cta-servicio[disabled] { opacity: .3; cursor: not-allowed; pointer-events: none; }
    .cierre { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 30px; text-align: center; }
    .btn-pildora { text-decoration: none; border: 1px solid #fff; border-radius: 50px; font-family: var(--sans); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.5); padding: 12px 20px; transition: all .4s; }
    .btn-pildora:hover, .btn-pildora:focus-visible { color: #fff; background: rgba(255,255,255,.1); }
    .volver { background: none; border: 0; padding: 6px 2px; cursor: pointer; font-family: var(--sans); font-size: 10px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--w-50); transition: color .2s; }
    .volver:hover { color: var(--w-100); }
    a.volver { text-decoration: none; }
    .nota { margin: 18px 0 0; font-size: 11px; font-weight: 300; line-height: 1.6; color: var(--w-50); }

    @media (max-width: 810px) {
      .pantalla { padding: 96px 16px 40px; align-items: flex-start; }
      .bloque { padding: 16px; }
      .pastilla { font-size: 12.5px; padding: 10px 16px; }
      .acciones { flex-direction: column-reverse; align-items: stretch; text-align: center; }
      .acciones .btn-cta-servicio { text-align: center; }
    }
      select[hidden], input[hidden], .campo[hidden], button[hidden] { display: none; }
    .progreso { scroll-margin-top: 84px; }
    @media (max-width: 810px) { .en-curso .intro { display: none; } }
    .campo-otro { margin-top: 18px; }
    .campo-otro[hidden] { display: none; }
  </style>
</head>

  <script>
    var sideMenu = document.getElementById('sideMenu');
    window.toggleMenu = function () { if (sideMenu) sideMenu.classList.toggle('open'); };
    document.addEventListener('click', function (e) {
      if (!sideMenu || !sideMenu.classList.contains('open')) return;
      var t = document.querySelector('.menu-toggle');
      if (sideMenu.contains(e.target) || (t && t.contains(e.target))) return;
      sideMenu.classList.remove('open');
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sideMenu) sideMenu.classList.remove('open'); });
  </script>

  <script src="/js/config.js"></script>
  <script>
  (function () {
    var CFG = window.CAVLA_CONFIG || {};
    var dudas = document.getElementById('nav-dudas');
    if (dudas && CFG.whatsapp) {
      dudas.href = 'https://wa.me/' + CFG.whatsapp + '?text=' + encodeURIComponent('Hi Cata, I have a question before starting my project.');
      dudas.target = '_blank'; dudas.rel = 'noopener';
    }
    var PROVINCIAS = ['Buenos Aires','Autonomous City of Buenos Aires','Catamarca','Chaco','Chubut','Córdoba','Corrientes','Entre Ríos','Formosa','Jujuy','La Pampa','La Rioja','Mendoza','Misiones','Neuquén','Río Negro','Salta','San Juan','San Luis','Santa Cruz','Santa Fe','Santiago del Estero','Tierra del Fuego','Tucumán','Other country'];

    // ── Origen: si viene de la página de un servicio (?desde=...) se salta la pregunta del tipo de diseño ──
    var ORIGENES = { mobiliario: { tipo: 0, nombre: 'Diseño de mobiliario' }, integral: { tipo: 1, nombre: 'Diseño integral' }, asesoria: { tipo: 1, nombre: 'Asesoría espacial' } };
    var DESDE = null;
    try { var qd = new URLSearchParams(location.search).get('desde'); if (qd && ORIGENES.hasOwnProperty(qd)) DESDE = ORIGENES[qd]; } catch (e) {}
    var TIPOS = ['I only need to design furniture', 'I want to design a space'];
    function pasoTipo() { return DESDE ? (DESDE.tipo === 0 ? 'mueble' : 'espacio') : 'tipo'; }
    var SESION = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    var ETIQUETA_PASO = { lugar: 'Ubicación', virtual: 'Modalidad', virtualaviso: 'Modalidad', tipo: 'Tipo de diseño', mueble: 'Muebles', condicion: 'Condición del espacio', ejecucion: 'Ejecución',
      espacio: 'Tipo de espacio', rubro: 'Rubro', estadoEsp: 'Estado del espacio', profundidad: 'Profundidad', profundidadC: 'Profundidad', problemas: 'Problemas', etapa: 'Etapa de la obra',
      uso: 'Uso del inmueble', ambientes: 'Ambientes', marca: 'Identidad de marca', superficie: 'Superficie', ejecucionObra: 'Ejecución de obra', presupuesto: 'Presupuesto', datos: 'Datos de contacto' };

    // ── Recorrido del formulario ──────────────────────────────
    var LOCALIDADES = ['Córdoba Capital', 'Villa Allende', 'Mendiolaza', 'Unquillo', 'Río Ceballos', 'Salsipuedes', 'La Calera', 'Saldán', 'Malagueño', 'Villa Carlos Paz']
      .sort(function (a, b) { return a.localeCompare(b, 'es'); }).concat(['Other']);   // ciudades donde se trabaja de forma presencial (alfabético) + Otra
    var PROFUNDIDAD = ['I want to reorganize what I already have', 'I want a complete redesign of the space'];
    var BORRAR = ['virtual', 'tipo', 'mueble', 'otro_mueble', 'condicion', 'ejecucion', 'espacio', 'rubro', 'otro_rubro', 'ambientes', 'otro_ambientes', 'superficie',
                  'marca', 'estadoEsp', 'problemas', 'otro_problemas', 'profundidad', 'profundidadC', 'etapa', 'uso', 'ejecucionObra'];
    var DEPENDE = {
      lugar: ['virtual', 'ejecucion', 'ejecucionObra'],
      tipo: BORRAR.slice(2),
      espacio: ['rubro', 'otro_rubro', 'ambientes', 'otro_ambientes', 'superficie', 'marca', 'estadoEsp', 'problemas', 'otro_problemas', 'profundidad', 'profundidadC', 'etapa', 'uso', 'ejecucionObra'],
      estadoEsp: ['problemas', 'otro_problemas', 'profundidad', 'profundidadC', 'etapa', 'uso']
    };

    // ── Recorrido del formulario ──────────────────────────────
    var PASOS = {
      lugar:  { tipo: 'lugar', q: 'Where is the project located?',
                ayuda: 'We work on site in Córdoba and surrounding areas. Everywhere else the work is 100% virtual.',
                next: function () { return esPresencial() ? pasoTipo() : 'virtual'; } },
      virtual:{ tipo: 'single', q: 'Are you okay with us working 100% virtually?',
                ayuda: 'Outside Córdoba City and its surroundings we work virtually. We do not make site visits or carry out construction in person, but we develop your project with the same quality.',
                opts: ['Yes, I agree', 'I would prefer something on site'],
                next: function (a) { return a === 0 ? pasoTipo() : 'virtualaviso'; } },
      virtualaviso:{ tipo: 'info', q: 'We only work virtually in your area',
                ayuda: 'You can still continue with the form and we will look for a solution on WhatsApp.',
                next: function () { return pasoTipo(); } },
      tipo:   { tipo: 'single', q: 'What kind of design do you need?',
                opts: TIPOS,
                next: function (a) { return a === 0 ? 'mueble' : 'espacio'; } },
      mueble: { tipo: 'multi', q: 'Which furniture do you want to design?', ayuda: 'You can choose more than one.',
                opts: ['Kitchen', 'Closet / walk-in closet', 'Bathroom', 'Living room / TV', 'Desk / office', 'Other'], otro: 5, otroPh: 'Tell us which piece of furniture',
                next: function () { return 'condicion'; } },
      condicion:{ tipo: 'single', q: 'What condition is the space in?',
                opts: ['Existing space', 'Under construction'],
                next: function () { return esPresencial() ? 'ejecucion' : 'presupuesto'; } },
      ejecucion:{ tipo: 'single', q: 'How do you want it built?',
                opts: ['I have a carpenter', 'I want the studio to handle it'],
                next: function () { return 'presupuesto'; } },
      espacio:{ tipo: 'single', q: 'What type of property is it?',
                opts: ['House', 'Apartment', 'Retail space', 'Restaurant / hospitality space'],
                next: function (a) { return a >= 2 ? 'rubro' : 'estadoEsp'; } },
      rubro:  { tipo: 'single', q: 'What line of business is it?',
                opts: function () { return indices.espacio === 3 ? ['Café', 'Restaurant', 'Bar', 'Other'] : ['Clothing', 'Food', 'Technology', 'Health and beauty', 'Home and decor', 'Books and toys', 'Other']; },
                otro: 'ultimo', otroPh: 'Tell us what line of business it is',
                next: function () { return 'estadoEsp'; } },
      estadoEsp:{ tipo: 'single', q: 'What condition is the space in?',
                opts: ['Existing space in good condition', 'Existing space in poor condition', 'Brand-new space', 'Under construction'],
                next: function (a) { return ['profundidad', 'problemas', 'profundidadC', 'etapa'][a]; } },
      profundidad:{ tipo: 'single', q: 'How deep a project are you looking for?', opts: PROFUNDIDAD,
                next: function (a) { return despuesProfundidad(a); } },
      problemas:{ tipo: 'multi', q: 'What kind of problems does the space have?', ayuda: 'You can choose more than one.',
                opts: ['Electrical installation', 'Water or gas installation', 'Sewage or drainage', 'Dampness', 'Roofs or leaks', 'Damaged doors and windows', 'Structural problems', 'Damaged walls', 'Other'], otro: 8, otroPh: 'Tell us what the problem is',
                next: function () { return 'profundidad'; } },
      profundidadC:{ tipo: 'single', q: 'How deep a project are you looking for?',
                opts: function () { return [esLocal() ? 'I want to move my furniture and equipment to the new space' : 'I want to adapt my belongings to this new space', 'I want a complete design from scratch']; },
                next: function (a) { return despuesProfundidad(a); } },
      etapa:  { tipo: 'single', q: 'What stage is the construction in?',
                opts: ['Early stage (structure)', 'Advanced stage (installations and finishes)'],
                next: function () { return esLocal() ? 'marca' : 'uso'; } },
      uso:    { tipo: 'single', q: 'What is the property for?',
                opts: ['To live in myself', 'To sell or rent it furnished'],
                next: function () { return 'ambientes'; } },
      ambientes:{ tipo: 'multi', q: 'Which rooms do you want to work on?', ayuda: 'You can choose more than one.',
                opts: ['Living / dining room', 'Kitchen', 'Bedrooms', 'Bathrooms', 'Other'], otro: 4, otroPh: 'Tell us which room',
                next: function () { return 'superficie'; } },
      marca:  { tipo: 'single', q: 'Do you already have a brand identity?',
                opts: ['Yes, I already have a brand identity', 'It is in progress', 'No, not yet', 'I do not know what that is'],
                next: function () { return 'superficie'; } },
      superficie:{ tipo: 'single', q: 'What is the total area of the project?',
                opts: ['Up to 25 m² (270 sq ft)', '25 to 50 m² (270 to 540 sq ft)', '50 to 100 m² (540 to 1,080 sq ft)', 'Over 100 m² (1,080 sq ft)', 'I do not know'],
                next: function () { return (!esLocal() && esPresencial()) ? 'ejecucionObra' : 'presupuesto'; } },
      ejecucionObra:{ tipo: 'single', q: 'How do you want it built?',
                opts: ['I have someone to carry out the work', 'Quiero que el estudio se encargue'],
                next: function () { return 'presupuesto'; } },
      presupuesto:{ tipo: 'single', q: 'Do you have a defined budget?',
                opts: ['I have not defined it yet', 'Yes, I do'],
                next: function () { return 'datos'; } },
      datos:  { tipo: 'campos', q: 'Lastly, how can I contact you?', final: true,
                campos: [ { id: 'nombre', label: 'Full name', tipo: 'text', req: true, auto: 'name' },
                          { id: 'telefono', label: 'WhatsApp', tipo: 'tel', ph: 'e.g. +1 555 123 4567', req: true, auto: 'tel' },
                          { id: 'email', label: 'Email (optional)', tipo: 'email', auto: 'email' } ],
                next: function () { return null; } }
    };

    var respuestas = {}, indices = {}, historial = ['lugar'];
    var cont = document.getElementById('paso');

    function getOpts(p) { return typeof p.opts === 'function' ? p.opts() : p.opts; }
    // Tras elegir el nivel de profundidad: en un local siempre se pregunta por la identidad de marca
    function despuesProfundidad() { return esLocal() ? 'marca' : 'ambientes'; }
    function esLocal() { return indices.espacio >= 2; }
    function esPresencial() { var l = respuestas.lugar; return !(l && !l.presencial); }
    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function totalPasos() {
      var pres = esPresencial(), ej = pres ? 1 : 0;
      var n = (DESDE ? 1 : 2) + (pres ? 0 : 1) + (respuestas.virtual === 'I would prefer something on site' ? 1 : 0);   // lugar, [virtual], [aviso], tipo
      if (indices.tipo === 0) return n + 4 + ej;                                                    // muebles: mueble, condición, [ejecución], presupuesto, datos → +4 con ejecución
      if (esLocal()) {                                                                              // espacio, rubro, estado, profundidad|etapa, [problemas], marca, superficie, presupuesto, datos
        return n + 8 + (indices.estadoEsp === 1 ? 1 : 0);
      }
      var rama = (indices.estadoEsp === 1 || indices.estadoEsp === 3) ? 1 : 0;                      // B: +problemas · D: +uso
      return n + 7 + rama + ej;                                                                     // espacio, estado, profundidad, ambientes, m², [ejecución], presupuesto, datos
    }

    function progreso() {
      var n = historial.length, t = totalPasos();
      document.getElementById('texto-progreso').textContent = 'Step ' + n + ' of ' + t;
      document.getElementById('barra-fill').style.width = ((n - 0.5) / t * 100) + '%';
    }

    // Si recargan la página, retoman donde estaban (solo en esta pestaña)
    var CLAVE = 'cavla_empezar_v1';
    function guardarProgreso() { try { sessionStorage.setItem(CLAVE, JSON.stringify({ r: respuestas, i: indices, h: historial })); } catch (e) {} }
    function limpiarProgreso() { try { sessionStorage.removeItem(CLAVE); } catch (e) {} }
    function retomar() {
      try {
        var g = JSON.parse(sessionStorage.getItem(CLAVE) || 'null');
        if (!g || !Array.isArray(g.h) || !g.h.length || !g.h.every(function (k) { return PASOS[k]; })) return;
        respuestas = g.r || {}; indices = g.i || {}; historial = g.h;
      } catch (e) {}
    }

    function render() {
      var id = historial[historial.length - 1], p = PASOS[id];
      progreso();
      var h = '<h2 class="pregunta">' + esc(p.q) + '</h2>' + (p.ayuda ? '<p class="ayuda">' + esc(p.ayuda) + '</p>' : '');
      if (p.tipo === 'single' || p.tipo === 'multi') {
        var unica = p.tipo === 'single', cl = unica ? 'opcion' : 'pastilla';
        h += '<div class="bloque"><div class="' + (unica ? 'opciones' : 'pastillas') + '" role="' + (unica ? 'radiogroup' : 'group') + '">';
        getOpts(p).forEach(function (o, i) { h += '<button type="button" class="' + cl + '" data-i="' + i + '"' + (unica ? ' role="radio"' : '') + '>' + esc(o) + '</button>'; });
        h += '</div>';
        if (p.otro !== undefined) h += '<div class="campo campo-otro" id="caja-otro" hidden><label for="f-otro">Which one?</label><input id="f-otro" type="text" maxlength="80" placeholder="' + esc(p.otroPh || 'Tell us which one') + '"></div>';
        h += '</div><div class="acciones">' +
             (historial.length > 1 ? '<button type="button" class="volver" id="volver">← Back</button>' : '<span></span>') +
             (p.tipo === 'multi' ? '<button type="button" class="btn-cta-servicio" id="continuar" disabled>Continue</button>' : '') +
             (unica && p.otro !== undefined ? '<button type="button" class="btn-cta-servicio" id="continuar" hidden>Continue</button>' : '') + '</div>';
      } else if (p.tipo === 'lugar') {
        h += '<form id="form-paso" novalidate><div class="bloque"><div class="campos">' +
             '<div class="campo"><label for="f-provincia">Province or state</label><select id="f-provincia"><option value="">Choose an option</option>' +
             PROVINCIAS.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select><span class="msg-error">Choose the province or state.</span></div>' +
             '<div class="campo" id="w-ciudad"><label for="f-ciudad">City</label><select id="f-ciudad" disabled><option value="">Choose the province or state first</option></select>' +
             '<input id="f-ciudad-txt" type="text" placeholder="Type the city" hidden><span class="msg-error">Choose or type the city.</span></div>' +
             '<div class="campo" id="w-cual" hidden><label for="f-cual" id="l-cual">Which city?</label><input id="f-cual" type="text" placeholder="e.g. Villa María"><span class="msg-error">Type the city.</span></div>' +
             '</div></div><div class="acciones"><span></span><button type="submit" class="btn-cta-servicio">Continue</button></div></form>';
      } else if (p.tipo === 'info') {
        h += '<div class="acciones">' + (historial.length > 1 ? '<button type="button" class="volver" id="volver">← Back</button>' : '<span></span>') +
             '<button type="button" class="btn-cta-servicio" id="continuar-info">Continue</button></div>';
      } else {
        h += '<form id="form-paso" novalidate><div class="bloque"><div class="campos">';
        p.campos.forEach(function (c) {
          if (c.tipo === 'check') {
            h += '<label class="check"><input type="checkbox" id="f-' + c.id + '"> ' + esc(c.label) + '</label>';
          } else if (c.tipo === 'select') {
            h += '<div class="campo"><label for="f-' + c.id + '">' + esc(c.label) + '</label><select id="f-' + c.id + '"><option value="">Choose an option</option>' +
                 (c.opciones || PROVINCIAS).map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select><span class="msg-error">Please fill in this field.</span></div>';
          } else {
            h += '<div class="campo"' + (c.si ? ' id="w-' + c.id + '" hidden' : '') + '><label for="f-' + c.id + '">' + esc(c.label) + '</label><input id="f-' + c.id + '" type="' + c.tipo + '"' +
                 (c.ph ? ' placeholder="' + esc(c.ph) + '"' : '') + (c.auto ? ' autocomplete="' + c.auto + '"' : '') + (c.tipo === 'tel' ? ' inputmode="tel"' : '') + '><span class="msg-error">Please fill in this field.</span></div>';
          }
        });
        h += '</div></div>';
        if (p.final) h += '<div class="trampa" aria-hidden="true"><label>Do not fill in<input type="text" id="f-web" tabindex="-1" autocomplete="off"></label></div>';
        h += '<div class="acciones">' + (historial.length > 1 ? '<button type="button" class="volver" id="volver">← Back</button>' : '<span></span>') +
             '<button type="submit" class="btn-cta-servicio">' + (p.final ? 'Send via WhatsApp' : 'Continuar') + '</button></div>';
        if (p.final) h += '<p class="nota">WhatsApp opens with your answers already written. We only use your details to reply to you.</p>';
        h += '</form>';
      }
      cont.innerHTML = h;
      cont.classList.remove('paso'); void cont.offsetWidth; cont.classList.add('paso');
      document.body.classList.toggle('en-curso', historial.length > 1);
      if (historial.length > 1 && cont.getBoundingClientRect().bottom > window.innerHeight) {   // si el paso no entra en pantalla, lo subimos
        var pr = document.querySelector('.progreso'), sc = [document.scrollingElement, document.body].filter(function (e) { return e && e.scrollHeight > e.clientHeight + 1; })[0];
        if (pr && sc) sc.scrollTo({ top: sc.scrollTop + pr.getBoundingClientRect().top - 90, behavior: 'smooth' });
      }
      enlazar(id, p);
      guardarProgreso();
    }

    function enlazar(id, p) {
      var v = document.getElementById('volver');
      if (v) v.addEventListener('click', function () { historial.pop(); render(); });

      if (p.tipo === 'lugar') {
        enlazarLugar(id, p);
      } else if (p.tipo === 'info') {
        document.getElementById('continuar-info').addEventListener('click', function () { avanzar(p, null); });
      } else if (p.tipo === 'single') {
        cont.querySelectorAll('.opcion').forEach(function (b) {
          var i = +b.getAttribute('data-i');
          if (indices[id] === i) b.classList.add('sel');
          b.addEventListener('click', function () {
            cont.querySelectorAll('.opcion').forEach(function (x) { x.classList.remove('sel'); });
            b.classList.add('sel');
            if (p.otro !== undefined) { otroSingle(id, p, i, false); if (i === otroIdx(p)) return; }
            setTimeout(function () { guardarUnica(id, p, i); }, 180);
          });
        });
        if (p.otro !== undefined) {
          var inO = document.getElementById('f-otro'), bC = document.getElementById('continuar');
          inO.addEventListener('input', function () { bC.disabled = !inO.value.trim(); });
          bC.addEventListener('click', function () { guardarUnica(id, p, otroIdx(p), inO.value.trim()); });
          if (indices[id] === otroIdx(p)) { otroSingle(id, p, indices[id], true); inO.value = respuestas['otro_' + id] || ''; bC.disabled = !inO.value.trim(); }
        }
      } else if (p.tipo === 'multi') {
        var sel = (indices[id] || []).slice(), btnC = document.getElementById('continuar');
        function pinta() {
          cont.querySelectorAll('.pastilla').forEach(function (b) { b.classList.toggle('sel', sel.indexOf(+b.getAttribute('data-i')) > -1); });
          var otroSel = p.otro !== undefined && sel.indexOf(p.otro) > -1, cajaO = document.getElementById('caja-otro');
          if (cajaO) cajaO.hidden = !otroSel;
          btnC.disabled = sel.length === 0 || (otroSel && !document.getElementById('f-otro').value.trim());
        }
        var inpO = document.getElementById('f-otro');
        if (inpO) { inpO.value = respuestas['otro_' + id] || ''; inpO.addEventListener('input', pinta); }
        cont.querySelectorAll('.pastilla').forEach(function (b) {
          b.addEventListener('click', function () {
            var i = +b.getAttribute('data-i'), k = sel.indexOf(i);
            if (k > -1) sel.splice(k, 1); else sel.push(i);
            pinta();
          });
        });
        btnC.addEventListener('click', function () {
          sel.sort(function (a, b) { return a - b; });
          indices[id] = sel; respuestas[id] = sel.map(function (i) { return getOpts(p)[i]; });
          if (p.otro !== undefined) {
            var tO = inpO.value.trim(), k = sel.indexOf(p.otro);
            respuestas['otro_' + id] = tO;
            if (k > -1) respuestas[id][k] = 'Otro: ' + tO;
          }
          avanzar(p, sel);
        });
        pinta();
      } else {
        var form = document.getElementById('form-paso');
        p.campos.forEach(function (c) {
          var el = document.getElementById('f-' + c.id), prev = respuestas[id] && respuestas[id][c.id];
          if (prev !== undefined && el) { if (c.tipo === 'check') el.checked = !!prev; else el.value = prev; }
        });
        p.campos.forEach(function (c) {
          if (!c.si) return;
          var origen = document.getElementById('f-' + c.si), wrap = document.getElementById('w-' + c.id);
          function muestra() { wrap.hidden = origen.value !== c.siVal; }
          origen.addEventListener('change', muestra); muestra();
        });
        form.addEventListener('submit', function (e) { e.preventDefault(); enviarPaso(id, p, form); });
      }
    }

    function otroIdx(p) { return p.otro === 'ultimo' ? getOpts(p).length - 1 : p.otro; }
    function otroSingle(id, p, i, inicial) {
      var es = i === otroIdx(p), caja = document.getElementById('caja-otro'), bC = document.getElementById('continuar');
      caja.hidden = !es; bC.hidden = !es; if (es) { bC.disabled = !document.getElementById('f-otro').value.trim(); if (!inicial) document.getElementById('f-otro').focus(); }
    }
    function limpiar(id) { (DEPENDE[id] || []).forEach(function (k) { delete respuestas[k]; delete indices[k]; }); }
    function enlazarLugar(id, p) {
      var prov = document.getElementById('f-provincia'), sel = document.getElementById('f-ciudad'), txt = document.getElementById('f-ciudad-txt'),
          wc = document.getElementById('w-cual'), wCiudad = document.getElementById('w-ciudad'), lCual = document.getElementById('l-cual'), cual = document.getElementById('f-cual'), prev = respuestas.lugar || {};
      function actualiza() {
        var pv = prov.value, esCba = pv === 'Córdoba', pais = pv === 'Other country';
        wCiudad.hidden = pais;
        lCual.textContent = pais ? 'Country' : 'Which city?'; cual.placeholder = pais ? 'e.g. Spain' : 'e.g. Villa María';
        if (pais) { wc.hidden = false; return; }
        if (!pv) { sel.hidden = false; sel.disabled = true; sel.innerHTML = '<option value="">Choose the province or state first</option>'; txt.hidden = true; wc.hidden = true; return; }
        if (esCba) {
          if (!sel.getAttribute('data-cba')) {
            sel.innerHTML = '<option value="">Choose an option</option>' + LOCALIDADES.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('');
            sel.setAttribute('data-cba', '1');
          }
          sel.hidden = false; sel.disabled = false; txt.hidden = true; wc.hidden = sel.value !== 'Other';
        } else {
          sel.hidden = true; sel.removeAttribute('data-cba'); txt.hidden = false; wc.hidden = true;
        }
      }
      if (!prev.provincia) { prov.value = 'Córdoba'; actualiza(); }
      if (prev.provincia) {
        prov.value = prev.provincia; actualiza();
        if (prev.provincia === 'Other country') { cual.value = prev.ciudad || ''; }
        else if (prev.provincia === 'Córdoba') { sel.value = prev.enLista ? prev.ciudad : 'Other'; if (!prev.enLista) { cual.value = prev.ciudad; } actualiza(); }
        else txt.value = prev.ciudad || '';
      }
      prov.addEventListener('change', function () { sel.removeAttribute('data-cba'); sel.value = ''; txt.value = ''; cual.value = ''; actualiza(); });
      sel.addEventListener('change', actualiza);
      document.getElementById('form-paso').addEventListener('submit', function (e) {
        e.preventDefault();
        var pv = prov.value, esCba = pv === 'Córdoba', ciudad = '', enLista = false, ok = true;
        [prov, sel, txt, cual].forEach(function (el) { var w = el.closest('.campo'); if (w) w.classList.remove('error'); });
        function error(el) { var w = el.closest('.campo'); if (w) w.classList.add('error'); if (ok) el.focus(); ok = false; }
        if (!pv) error(prov);
        else if (pv === 'Other country') { ciudad = cual.value.trim(); if (!ciudad) { cual.closest('.campo').querySelector('.msg-error').textContent = 'Type the country.'; error(cual); } }
        else if (esCba) {
          if (!sel.value) error(sel);
          else if (sel.value === 'Other') { ciudad = cual.value.trim(); if (!ciudad) error(cual); }
          else { ciudad = sel.value; enLista = true; }
        } else { ciudad = txt.value.trim(); if (!ciudad) error(txt); }
        if (!ok) return;
        var antes = respuestas.lugar;
        respuestas.lugar = { provincia: pv, ciudad: ciudad, enLista: enLista, presencial: esCba && enLista };
        if (antes && antes.presencial !== respuestas.lugar.presencial) limpiar('lugar');
        avanzar(p, null);
      });
    }
    function guardarUnica(id, p, i, textoOtro) {
      var cambio = indices[id] !== undefined && indices[id] !== i;
      indices[id] = i; respuestas[id] = getOpts(p)[i];
      if (textoOtro) { respuestas['otro_' + id] = textoOtro; respuestas[id] = 'Otro: ' + textoOtro; }
      if (cambio) limpiar(id);
      avanzar(p, i);
    }
    function avanzar(p, a) { var sig = p.next(a); if (sig) { historial.push(sig); render(); } }

    function enviarPaso(id, p, form) {
      var vals = {}, ok = true;
      p.campos.forEach(function (c) {
        var el = document.getElementById('f-' + c.id);
        vals[c.id] = c.tipo === 'check' ? el.checked : el.value.trim();
        var w = el.closest('.campo'); if (w) w.classList.remove('error');
      });
      function marcar(idc, msg) {
        var el = document.getElementById('f-' + idc), w = el && el.closest('.campo');
        if (w) { w.classList.add('error'); if (msg) w.querySelector('.msg-error').textContent = msg; }
        ok = false;
      }
      p.campos.forEach(function (c) { if (c.req && !vals[c.id]) marcar(c.id, 'Please fill in this field.'); });
      if (vals.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(vals.email)) marcar('email', 'Check the email, it looks incomplete.');
      if (vals.telefono && vals.telefono.replace(/\D/g, '').length < 8) marcar('telefono', 'Type your number with the country and area code.');
      if (p.validar) { var er = p.validar(vals); if (er) Object.keys(er).forEach(function (k) { marcar(k, er[k]); }); }
      if (!ok) { var primero = form.querySelector('.campo.error input, .campo.error select'); if (primero) primero.focus(); return; }
      respuestas[id] = vals;
      if (p.final) { var tr = document.getElementById('f-web'); finalizar(tr && tr.value); return; }
      avanzar(p, null);
    }

    // ── Mensaje de WhatsApp y guardado ────────────────────────
    function lista(v) { return Array.isArray(v) ? v.join(', ') : v; }
    function resumen() {
      var r = respuestas, d = r.datos || {}, l = r.lugar || {}, pres = esPresencial();
      var ub = l.ciudad ? (l.provincia === 'Other country' ? l.ciudad : l.ciudad + ', ' + l.provincia) : '';
      var modalidad = pres ? 'On site' : (r.virtual === 'I would prefer something on site' ? 'Virtual (would prefer on site)' : 'Virtual (agrees)');
      return {
        servicio_origen: DESDE ? DESDE.nombre : 'Directo', idioma: 'en', sesion: SESION,
        ubicacion: ub, modalidad: modalidad,
        tipo_diseno: r.tipo || '', muebles: r.mueble ? lista(r.mueble) : '', tipo_espacio: r.espacio || '',
        rubro: r.rubro || '', superficie: r.superficie || '', marca: r.marca || '',
        condicion: r.estadoEsp || r.condicion || '', problemas: r.problemas ? lista(r.problemas) : '', problemas_n: r.problemas ? r.problemas.length : 0, etapa: r.etapa || '', uso: r.uso || '',
        ejecucion: pres ? (r.ejecucion || r.ejecucionObra || '') : 'I handle it myself (virtual project)',
        alcance: r.profundidad || r.profundidadC || '', ambientes: r.ambientes ? lista(r.ambientes) : '',
        presupuesto: r.presupuesto || '',
        provincia: l.provincia || '', ciudad: l.ciudad || '', nombre: d.nombre || '', telefono: d.telefono || '', email: d.email || ''
      };
    }
    function mensaje(c) {
      var l = ['Hi Catalina! My name is ' + c.nombre + '.', '', 'I filled in the form on the website (English version):'];
      l.push('• Location: ' + c.ubicacion);
      l.push('• Mode: ' + c.modalidad);
      l.push('• Design: ' + c.tipo_diseno);
      if (c.muebles) l.push('• Furniture: ' + c.muebles);
      if (c.tipo_espacio) l.push('• Property: ' + c.tipo_espacio);
      if (c.rubro) l.push('• Line of business: ' + c.rubro);
      if (c.condicion) l.push('• Condition of the space: ' + c.condicion);
      if (c.problemas) l.push('• Problems: ' + c.problemas);
      if (c.etapa) l.push('• Construction stage: ' + c.etapa);
      if (c.uso) l.push('• Property use: ' + c.uso);
      if (c.alcance) l.push('• Scope: ' + c.alcance);
      if (c.superficie) l.push('• Area: ' + c.superficie);
      if (c.marca) l.push('• Brand identity: ' + c.marca);
      if (c.ambientes) l.push('• Rooms: ' + c.ambientes);
      if (c.ejecucion) l.push('• Execution: ' + c.ejecucion);
      l.push('• Defined budget: ' + c.presupuesto);
      if (c.email) l.push('• Email: ' + c.email);
      l.push('• WhatsApp: ' + c.telefono);
      return l.join('\n');
    }

    function finalizar(esBot) {
      var c = resumen(), url = 'https://wa.me/' + CFG.whatsapp + '?text=' + encodeURIComponent(mensaje(c));
      terminado = true;
      if (!esBot && window.cavlaTrack) cavlaTrack('generate_lead', { servicio: (typeof DESDE !== 'undefined' && DESDE) ? DESDE.nombre : 'Directo' });
      var w = null;
      try { w = window.open(url, '_blank'); if (w) w.opener = null; } catch (e) {}   // se abre en otra pestaña para que el sitio siga abierto
      if (!esBot && CFG.appsScriptUrl) {
        try {
          fetch(CFG.appsScriptUrl, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(Object.assign({ tipo: 'consulta', origen: location.href }, c)) });
        } catch (e) { /* si falla el guardado igual seguimos por WhatsApp */ }
      }
      limpiarProgreso();
      document.getElementById('texto-progreso').textContent = 'Done';
      document.getElementById('barra-fill').style.width = '100%';
      cont.innerHTML = '<h2 class="pregunta">Thank you, ' + esc(c.nombre.split(' ')[0]) + '.</h2>' +
        '<p class="ayuda">' + (w ? 'WhatsApp opened in another tab with your answers already written. Just press send.' : 'I am taking you to WhatsApp with your answers already written. Just press send.') + '</p>' +
        '<div class="cierre"><a class="btn-pildora" href="/en/projects">Want to see how we work?</a>' +
        '<a class="volver" href="' + url + '" target="_blank" rel="noopener">' + (w ? 'Open WhatsApp again' : 'Open WhatsApp') + '</a></div>';
      if (!w) setTimeout(function () { window.location.href = url; }, 900);
    }

    retomar();
    if (DESDE) {   // si había un recorrido guardado con otro origen, se empieza de nuevo
      if (historial.indexOf('tipo') > -1 || (indices.tipo !== undefined && indices.tipo !== DESDE.tipo)) { respuestas = {}; indices = {}; historial = ['lugar']; }
      indices.tipo = DESDE.tipo; respuestas.tipo = TIPOS[DESDE.tipo];
    }
    // Abandonos: si la persona interactuó y se va sin enviar, se registra hasta qué paso llegó
    var interactuo = false, terminado = false, ultimoEnvio = '';
    cont.addEventListener('click', function () { interactuo = true; });
    cont.addEventListener('input', function () { interactuo = true; });
    function avisarAbandono() {
      if (terminado || !interactuo || !CFG.appsScriptUrl) return;
      var paso = historial[historial.length - 1], l = respuestas.lugar || {};
      var datos = JSON.stringify({ tipo: 'abandono', idioma: 'en', sesion: SESION, ultimo_paso: ETIQUETA_PASO[paso] || paso,
        ubicacion: l.ciudad ? (l.provincia === 'Other country' ? l.ciudad : l.ciudad + ', ' + l.provincia) : '', servicio_origen: DESDE ? DESDE.nombre : 'Directo' });
      if (datos === ultimoEnvio) return;
      ultimoEnvio = datos;
      try { if (!(navigator.sendBeacon && navigator.sendBeacon(CFG.appsScriptUrl, new Blob([datos], { type: 'text/plain;charset=utf-8' })))) throw 0; }
      catch (e) { try { fetch(CFG.appsScriptUrl, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: datos }); } catch (e2) {} }
    }
    window.addEventListener('pagehide', avisarAbandono);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') avisarAbandono(); });
    render();
  })();
  </script>
