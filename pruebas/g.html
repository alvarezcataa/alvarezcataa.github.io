<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>Prueba G</title><style>
*{margin:0;box-sizing:border-box}html{scroll-snap-type:y mandatory;background:#130c09;--T:62px}body{background:#130c09}
.w{position:static}
.s{position:relative;scroll-snap-align:start;scroll-snap-stop:always;scroll-margin-top:calc(-1*var(--T));background:repeating-linear-gradient(0deg,#e8a36b 0 40px,#3b7a6b 40px 80px,#6b6be8 80px 120px,#e86b9d 120px 160px);overflow-x:clip}
#b{position:fixed;left:8px;top:35%;z-index:100;display:flex;flex-direction:column;gap:8px}
#b button{font:600 14px system-ui;padding:12px 14px;border-radius:10px;border:2px solid #fff;background:#000c;color:#fff;text-align:left}
#b button.on{background:#d22}
.o1{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:50;display:none;pointer-events:none}
.o2{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:50;transform:translate3d(100%,0,0);transition:transform .5s;will-change:transform;pointer-events:none}.o2.on{transform:none}
.o3{position:fixed;inset:0;z-index:50;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:none;pointer-events:none}
.o6{position:fixed;inset:0;z-index:50;pointer-events:none;visibility:hidden}.o6.on{visibility:visible}
.f4 .w{filter:blur(4px)}
.f5{--x:1}
.fr{position:absolute;left:0;right:0;pointer-events:none}.fr.t{top:0;height:102px;background:linear-gradient(#130c09f2,#130c0900)}.fr.b{bottom:0;height:138px;background:linear-gradient(to top,#130c09f2,#130c0900)}
</style></head><body>
<div id="b"><button data-m="1">1 capa simple</button><button data-m="2">2 capa que se desliza</button><button data-m="3">3 capa con blur</button><button data-m="4">4 blur a la página</button><button data-m="5">5 solo una clase</button><button data-m="6">6 capa visibility</button></div>
<div class="o1"></div><div class="o2"></div><div class="o3"></div><div class="o6"></div>
<div class="w" id="w"></div>
<script>
var S=Math.max(screen.width,screen.height),T={956:62,932:59,926:47,896:48,874:62,852:59,844:47,812:50}[S]||59;
document.documentElement.style.setProperty('--T',T+'px');
var w=document.getElementById('w');
for(var i=0;i<3;i++){var d=document.createElement('div');d.className='s';d.style.height=S+'px';d.style.paddingTop=T+'px';d.innerHTML='<div style="color:#fff;font:700 22px system-ui;padding:100px 20px;text-shadow:0 0 6px #000">pantalla '+(i+1)+'<br>mirá las franjas de arriba y abajo mientras tocás los botones</div><i class="fr t"></i><i class="fr b"></i>';w.appendChild(d)}
addEventListener('load',function(){scrollTo(0,T)});
var on={};
document.querySelectorAll('#b button').forEach(function(b){b.onclick=function(){var m=b.dataset.m;on[m]=!on[m];b.classList.toggle('on',on[m]);
 if(m==1)document.querySelector('.o1').style.display=on[m]?'block':'none';
 if(m==2)document.querySelector('.o2').classList.toggle('on',on[m]);
 if(m==3)document.querySelector('.o3').style.display=on[m]?'block':'none';
 if(m==4)document.documentElement.classList.toggle('f4',on[m]);
 if(m==5)document.documentElement.classList.toggle('f5',on[m]);
 if(m==6)document.querySelector('.o6').classList.toggle('on',on[m]);
}});
</script></body></html>
